<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Open ledger book"><title>Open ledger book</title><defs><pattern id="hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.6" stroke="var(--hl-grid,#d4d4da)" stroke-width="0.55"/></pattern><style>.f-ink{fill:var(--hl-ink,#1a1a1a)}.s-ink{stroke:var(--hl-ink,#1a1a1a)}.f-graphite{fill:var(--hl-graphite,#7a7a7a)}.s-graphite{stroke:var(--hl-graphite,#7a7a7a)}.f-mute{fill:var(--hl-mute,#b6b6be)}.s-mute{stroke:var(--hl-mute,#b6b6be)}.f-grid{fill:var(--hl-grid,#d4d4da)}.s-grid{stroke:var(--hl-grid,#d4d4da)}.f-surface-3{fill:var(--hl-surface-3,#dcdce1)}.s-surface-3{stroke:var(--hl-surface-3,#dcdce1)}.f-surface-2{fill:var(--hl-surface-2,#e6e6ea)}.s-surface-2{stroke:var(--hl-surface-2,#e6e6ea)}.f-surface-1{fill:var(--hl-surface-1,#f2f2f4)}.s-surface-1{stroke:var(--hl-surface-1,#f2f2f4)}.f-surface-0{fill:var(--hl-surface-0,#ffffff)}.s-surface-0{stroke:var(--hl-surface-0,#ffffff)}.f-accent{fill:var(--hl-accent,#c6a15a)}.s-accent{stroke:var(--hl-accent,#c6a15a)}.f-accent-tint{fill:var(--hl-accent-tint,#f9f6ef)}.s-accent-tint{stroke:var(--hl-accent-tint,#f9f6ef)}@keyframes hl-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes hl-fade{from{opacity:0}to{opacity:var(--o,1)}}.hl-d{stroke-dasharray:1;stroke-dashoffset:1;animation:hl-draw .6s ease-out var(--d) both,hl-fade .3s ease-out var(--d) both}.hl-a{animation:hl-fade .33s ease-out var(--d) both}@media (prefers-reduced-motion:reduce){.hl-d,.hl-a{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}@keyframes hl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}#float{animation:hl-float 2.8s ease-in-out 1.2s infinite}@media (prefers-reduced-motion:reduce){#float{animation:none}}</style></defs><g id="illustration"><g fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="s-mute hl-a" d="M595.3,285.9 L23.6,571.8 M976.4,476.5 L404.7,762.4 M489.4,285.9 L976.4,529.4 M23.6,518.8 L510.6,762.4" stroke-width="2.1" stroke-dasharray="3 9" data-role="decor" style="--d:0.000s"/><g id="float"><path class="f-surface-0 s-graphite hl-a" d="M341.2,414.7 L531.8,306.4 L849.4,465.2 L860,492.4 L658.8,593 L341.2,434.2 Z" stroke-width="2.1" style="--d:0.233s"/><path class="s-grid hl-d" d="M531.8,306.4 L849.4,465.2 L658.8,573.5 L341.2,414.7 Z" stroke-width="2.1" pathLength="1" style="--d:0.462s"/><path class="f-surface-0 s-graphite hl-a" d="M140,534.7 L150.6,497 L341.2,414.7 L658.8,573.5 L658.8,593 L457.6,693.6 Z" stroke-width="2.1" style="--d:0.690s"/><path class="s-grid hl-d" d="M341.2,414.7 L658.8,573.5 L468.2,655.8 L150.6,497 Z" stroke-width="2.1" pathLength="1" style="--d:0.919s"/><path class="s-grid hl-d" d="M563.5,346.1 L415.3,428 M605.9,367.3 L457.6,449.2 M648.2,388.4 L500,470.3 M690.6,409.6 L542.4,491.5 M732.9,430.8 L584.7,512.7 M775.3,452 L627,533.9" stroke-width="2.1" pathLength="1" style="--d:1.148s"/><path class="s-grid hl-d" d="M373,449.2 L224.7,515.5 M415.3,470.3 L267.1,536.7 M457.6,491.5 L309.4,557.8 M500,512.7 L351.8,579 M542.4,533.9 L394.1,600.2 M584.7,555 L436.5,621.4" stroke-width="2.1" pathLength="1" style="--d:1.376s"/><path class="f-surface-0 s-accent hl-a" d="M629.7,566.9 L642.9,560.3 L706.5,611.5 L693.2,618.1 L678.9,607.3 Z" stroke-width="2.1" style="--d:1.605s"/></g></g></g></svg>